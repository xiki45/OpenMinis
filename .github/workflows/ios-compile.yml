name: iOS compile check

# 目的：在没有 Xcode 的机器上也能知道 iOS 代码能不能编译。
#
# 仓库是公开仓，GitHub 的 macOS runner 不额外计费。这里只买一个结论：
# **Swift 层零 error**。
#
# 为什么不追求完整构建：iOS 的原生依赖（ish / rclone / ffmpeg / lame / talloc）
# 要从源码编，代价很大，而且与业务代码回归无关。而 xcodebuild 的编译顺序是
# 「先编 Swift，再链接」，所以即使链接阶段因为缺依赖失败，Swift 的编译错误也
# 已经全部出现在日志里了 —— 这正是之前那类
# `Cannot find 'SystemPromptProseStore' in scope` 的捕获点。
#
# 判定规则：
#   - 日志里有 *.swift:N:M: error:            → 失败
#   - 构建成功                                → 通过
#   - 构建失败，但日志出现过编译阶段标记        → 通过（链接失败属预期）
#   - 构建失败且根本没进到编译阶段              → 失败（无法验证，不能假绿）

on:
  push:
    branches: [feature/system-assist, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-compile:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # 桥接头 MinisApp-Bridging-Header.h 直接 #include "ish/ish.h"，
          # 所以编 Swift 就必须有 deps/ish 等子模块。
          submodules: recursive
          fetch-depth: 0 # 下面的成员检查需要 merge-base

      # rclone 用 go build -buildmode=c-archive 产出库和 librclone.h。
      # macOS runner 上没有可直接调用的 go，得显式装。
      - name: Set up Go (for the rclone archive)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          go version

      # 真编 rclone 很贵（Go c-archive × 2 个 slice），但它是编译期硬依赖，
      # 不能像 ffmpeg 那样用空壳糊过去 —— 头文件是构建产物。按 go.sum 缓存。
      - name: Cache Rclone.xcframework
        uses: actions/cache@v4
        with:
          path: |
            deps/frameworks/Rclone.xcframework
            ~/go/pkg/mod
            ~/.cache/go-build
          key: rclone-${{ runner.os }}-${{ hashFiles('deps/rclone-mobile/go.sum', 'deps/build_rclone_ios.sh') }}

      - name: Source pre-check (membership + parse)
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
          bash scripts/check_ios_sources.sh origin/main

      # 让构建能走到 Swift 编译阶段。这一层不是要产出可用的 App，只补齐
      # xcodebuild 在加载工程和解析桥接头时才需要的东西：
      #
      #  1) ProviderCustomization.xcconfig —— 仓库只提交 .example，真体被
      #     gitignore，缺了它工程在加载时就报 "Unable to open base
      #     configuration reference file"。
      #  2) deps/include/ish/** —— 桥上头的 #include "ish/ish.h" 与
      #     "fs/devices.h" 是编译期依赖；build_ish.sh 会把 deps/ish 的头文件
      #     摊进 deps/include/ish，这里做同样的搬运，但跳过库与 VDSO 的编译
      #     （那是链接期的事）。
      #  3) deps/frameworks/*.xcframework —— 8 个预编译产物同样只在链接期
      #     使用（全仓没有任何 Swift/ObjC 源 import FFmpeg / Rclone 模块），
      #     所以用空壳静态库占位即可让工程加载通过；真正的链接失败留到后面
      #     由"编译过但链接失败算通过"那条规则放行。
      - name: Prepare build inputs (config, iSH headers, framework stubs)
        run: |
          set -euo pipefail

          cfg=src/ios/Configs/ProviderCustomization.xcconfig
          if [ ! -f "$cfg" ]; then
            cp src/ios/Configs/ProviderCustomization.xcconfig.example "$cfg"
            echo "created $cfg from the committed .example"
          fi

          mkdir -p deps/include/ish
          if [ -d deps/ish ] && [ -n "$(ls -A deps/ish 2>/dev/null)" ]; then
            # 保留目录结构，只要 .h（对应 build_ish.sh 的 copy_outputs 段）
            rsync -a --include='*/' --include='*.h' --exclude='*' deps/ish/ deps/include/ish/
            echo "staged $(find deps/include/ish -name '*.h' | wc -l | tr -d ' ') iSH headers"
          else
            echo "::error::deps/ish submodule is empty — cannot satisfy the bridging header"
            exit 1
          fi

          # ish/ish.h 不是子模块里的文件，而是 build_ish.sh 用 heredoc 生成的伞头。
          # 这里从脚本里原样抽取，避免把同一份内容复制进 workflow 造成漂移。
          awk '/cat > "\$OUTPUT_INCLUDE\/ish\/ish\.h" << .EOF./{grab=1; next} grab && /^EOF$/{exit} grab{print}' \
            deps/build_ish.sh > deps/include/ish/ish.h
          if ! grep -q '#define ISH_H' deps/include/ish/ish.h; then
            echo "::error::could not extract the iSH umbrella header from deps/build_ish.sh (its heredoc format changed?)"
            exit 1
          fi
          echo "umbrella header: $(wc -l < deps/include/ish/ish.h) lines"

          mkdir -p deps/frameworks
          # Rclone 不能造假：桥接头 #import "librclone.h"，而该头是
          # `go build -buildmode=c-archive` 的产物，必须跟库一起生成。runner
          # 自带 Go，真编一次后由 cache 摊掉后续成本。
          if [ ! -d deps/frameworks/Rclone.xcframework ]; then
            go version
            ./deps/build_rclone_ios.sh
          fi

          stub=$(mktemp -d)
          printf 'int __minis_link_stub;\n' > "$stub/stub.c"
          xcrun --sdk iphoneos clang -arch arm64 -c "$stub/stub.c" -o "$stub/stub.o"
          for fw in FFmpeg libavcodec libavformat libavutil libavfilter libswresample libswscale; do
            if [ ! -d "deps/frameworks/$fw.xcframework" ]; then
              # 每个桩必须用不同的库名：拷贝阶段按 basename 生成输出路径，同名会被
              # 判成 duplicate output file 而直接失败。
              ar rcs "$stub/lib$fw.a" "$stub/stub.o"
              xcodebuild -create-xcframework -library "$stub/lib$fw.a" \
                -output "deps/frameworks/$fw.xcframework" >/dev/null
            fi
          done
          echo "frameworks: $(ls deps/frameworks | tr '\n' ' ')"

          # 拷贝阶段同样在读这些产物；给空的合法占位，避免拷贝阶段先于编译
          # 阶段报错（那会让门禁误判成"没进到编译"）。
          mkdir -p deps/resources/RootfsPatch.bundle
          if [ ! -f deps/resources/RootfsPatch.bundle/Info.plist ]; then
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>CFBundleIdentifier</key><string>com.openminis.rootfspatch</string><key>CFBundlePackageType</key><string>BNDL</string></dict></plist>\n' \
              > deps/resources/RootfsPatch.bundle/Info.plist
          fi
          if [ ! -f deps/resources/alpine-rootfs.zip ]; then
            z=$(mktemp -d)
            printf 'placeholder\n' > "$z/README"
            ( cd "$z" && zip -q -r "$OLDPWD/deps/resources/alpine-rootfs.zip" README )
          fi
          ls -l deps/resources | head

      - name: xcodebuild — Swift compile is the gate
        run: |
          set +e
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > build.log 2>&1
          status=$?
          set -e

          swift_errors=$(grep -cE '\.swift:[0-9]+:[0-9]+: (fatal )?error:' build.log)
          compile_markers=$(grep -cE '(SwiftDriver|SwiftCompile|CompileSwift|CompileC )' build.log)
          echo "xcodebuild status=$status  swift_errors=$swift_errors  compile_markers=$compile_markers"

          if [ "$swift_errors" -gt 0 ]; then
            echo "::group::Swift errors"
            grep -nE '\.swift:[0-9]+:[0-9]+: (fatal )?error:' build.log | head -80
            echo "::endgroup::"
            echo "::error::Swift 编译错误 $swift_errors 处"
            exit 1
          fi

          if [ "$status" -eq 0 ]; then
            echo "✓ 完整构建通过"
            exit 0
          fi

          if [ "$compile_markers" -gt 0 ]; then
            echo "::group::构建尾部日志（失败发生在编译之后，通常缺原生依赖）"
            tail -40 build.log
            echo "::endgroup::"
            echo "✓ Swift 层零 error（后续阶段失败不计入门禁）"
            exit 0
          fi

          echo "::group::构建尾部日志"
          tail -80 build.log
          echo "::endgroup::"
          echo "::error::构建在编译 Swift 之前就失败，无法验证代码 —— 这不是通过"
          exit 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-${{ github.run_id }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
